[package]
name = "pa-trainer"
version = "0.1.0"
description = "Mapa e guia de treino para Padventures"
authors = ["Rodrigo Caon"]
edition = "2021"

[lib]
name = "pa_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
